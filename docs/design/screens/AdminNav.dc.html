<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DRAKON admin menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Noto+Sans+Bengali:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav class="dk-adminnav" aria-label="Admin" style="box-sizing: border-box; min-height: 760px; height: 100%; display: flex; flex-direction: column; gap: 32px; padding: 24px 16px; border-right: 1px solid #1d2842; background: #0f1729; color: #e7e3dc; font-family: Outfit, system-ui, sans-serif;">
  <a href="AdminOrders.dc.html" style="display: inline-flex; align-items: center; gap: 8px; padding: 0 8px; color: #f6f3ee; font-size: 18px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em; text-decoration: none;">
    <span aria-hidden="true" style="display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: #ed751a; color: #0a0f1b; font-size: 16px; font-weight: 700; letter-spacing: 0;">D</span>
    Drakon <span style="color: #8a92a5; font-weight: 400;">Admin</span>
  </a>

  <div class="dk-adminnav-items" style="display: flex; flex-direction: column; gap: 4px;">
    <a href="#" aria-current="{{dashboard.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; box-sizing: border-box; padding: 8px 12px; border-radius: 8px; background: {{dashboard.bg}}; color: {{dashboard.color}}; font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: none;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>
      Dashboard
    </a>
    <a href="AdminOrders.dc.html" aria-current="{{orders.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; box-sizing: border-box; padding: 8px 12px; border-radius: 8px; background: {{orders.bg}}; color: {{orders.color}}; font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: none;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path></svg>
      <span style="flex-grow: 1;">Orders</span>
      <sc-if value="{{hasPending}}" hint-placeholder-val="{{true}}">
        <span aria-label="{{pendingLabel}}" style="display: grid; place-items: center; min-width: 22px; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 9999px; background: #ed751a; color: #0a0f1b; font-size: 12px; line-height: 16px; font-weight: 600;">{{pendingCount}}</span>
      </sc-if>
    </a>
    <a href="AdminProducts.dc.html" aria-current="{{products.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; box-sizing: border-box; padding: 8px 12px; border-radius: 8px; background: {{products.bg}}; color: {{products.color}}; font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: none;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>
      Products
    </a>
    <a href="#" aria-current="{{categories.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; box-sizing: border-box; padding: 8px 12px; border-radius: 8px; background: {{categories.bg}}; color: {{categories.color}}; font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: none;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path></svg>
      Categories
    </a>
    <a href="#" aria-current="{{stock.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; box-sizing: border-box; padding: 8px 12px; border-radius: 8px; background: {{stock.bg}}; color: {{stock.color}}; font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: none;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"></path><path d="M12 22V12"></path><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"></path><path d="m7.5 4.27 9 5.15"></path></svg>
      Stock
    </a>
    <a href="#" aria-current="{{settings.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; box-sizing: border-box; padding: 8px 12px; border-radius: 8px; background: {{settings.bg}}; color: {{settings.color}}; font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: none;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"></line><line x1="10" x2="3" y1="4" y2="4"></line><line x1="21" x2="12" y1="12" y2="12"></line><line x1="8" x2="3" y1="12" y2="12"></line><line x1="21" x2="16" y1="20" y2="20"></line><line x1="12" x2="3" y1="20" y2="20"></line><line x1="14" x2="14" y1="2" y2="6"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="16" x2="16" y1="18" y2="22"></line></svg>
      Settings
    </a>
  </div>

  <div class="dk-adminnav-foot" style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 8px 0; border-top: 1px solid #1d2842;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="color: #f6f3ee; font-size: 14px; line-height: 20px; font-weight: 600;">Owner</span>
      <span style="color: #8a92a5; font-size: 12px; line-height: 16px;">Signed in · one admin account</span>
    </div>
    <button type="button" style="display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 8px 12px; border: 0; border-radius: 10px; background: transparent; color: #b3b8c4; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; cursor: pointer;">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg>
      Log out
    </button>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","orders","products","categories","stock","settings"],"default":"orders"},"pendingCount":{"editor":"int","min":0,"max":99,"default":4},"$preview":{"width":260,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'orders';
    const pending = this.props.pendingCount ?? 4;
    const item = (key) => ({
      bg: active === key ? '#141d31' : 'transparent',
      color: active === key ? '#f6f3ee' : '#b3b8c4',
      current: active === key ? 'page' : 'false'
    });
    return {
      dashboard: item('dashboard'),
      orders: item('orders'),
      products: item('products'),
      categories: item('categories'),
      stock: item('stock'),
      settings: item('settings'),
      pendingCount: pending,
      hasPending: pending > 0,
      pendingLabel: pending + ' orders waiting for phone confirmation'
    };
  }
}
</script>
</body>
</html>
