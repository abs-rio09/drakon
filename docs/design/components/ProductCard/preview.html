<!-- @dsCard group="Commerce" height=520 width=960 subtitle="Limited run, low stock, sold out" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Product card</title>
<style>.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--space-10);padding:var(--space-8);}</style>
</head>
<body class="dk-root">
<div class="grid">
  <article class="dk-card">
    <div class="dk-card__frame"><a class="dk-card__media" href="#" aria-label="Dragon Flame Playcard Set"><span class="dk-card__well">Photo · 1:1</span></a>
    <button class="dk-card__add" type="button" aria-label="Add Dragon Flame Playcard Set to cart"><svg class="dk-icon dk-icon--md" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div>
    <div class="dk-card__body">
      <h3 class="dk-card__title">Dragon Flame Playcard Set</h3>
      <span class="dk-card__meta">Playcard set, limited run</span>
      <div class="dk-card__row"><span class="dk-card__price">৳1,250</span><span class="dk-card__stock">12 left</span></div>
    </div>
  </article>
  <article class="dk-card">
    <div class="dk-card__frame"><a class="dk-card__media" href="#" aria-label="Midnight Circuit Desk Drone"><span class="dk-card__well">Photo · 1:1</span></a>
    <button class="dk-card__add" type="button" aria-label="Add Midnight Circuit Desk Drone to cart"><svg class="dk-icon dk-icon--md" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div>
    <div class="dk-card__body">
      <h3 class="dk-card__title">Midnight Circuit Desk Drone</h3>
      <span class="dk-card__meta">Tech toy, limited run</span>
      <div class="dk-card__row"><span class="dk-card__price">৳3,400</span><span class="dk-card__stock">Only 3 left</span></div>
    </div>
  </article>
  <article class="dk-card dk-card--soldout">
    <div class="dk-card__frame"><div class="dk-card__media"><span class="dk-card__well">Photo · grayscale</span><span class="dk-card__badge dk-badge dk-badge--soldout"><svg class="dk-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Sold out</span></div></div>
    <div class="dk-card__body">
      <h3 class="dk-card__title">Ember Night Hoodie · Edition 01</h3>
      <span class="dk-card__meta">Clothes, limited run</span>
      <div class="dk-card__row"><span class="dk-card__price">৳2,100</span><span class="dk-card__stock">Sold out</span></div>
    </div>
  </article>
</div>
</body>
</html>
