  .scale { fill: none; stroke: var(--surface); stroke-width: 2; }
  .card { rx: var(--radius-3xl); }
  .chip { rx: var(--radius-lg); }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
