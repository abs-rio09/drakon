# Local PostgreSQL for development (roadmap step 4a).
# Start: docker compose up -d db
# Credentials come from .env (gitignored). Copy .env.example to .env first.

services:
  db:
    # Pin the major version. Neon (production) must use the same major.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Only this computer can connect (127.0.0.1), not other devices on the Wi-Fi.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/18/docker,
      # so the volume mounts the parent folder /var/lib/postgresql.
      - drakon-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  drakon-db-data:
